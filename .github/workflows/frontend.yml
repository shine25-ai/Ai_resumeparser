name: Deploy Resume Parser Frontend

on:
  push:
    branches:
      - development

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          echo "API URL: $VITE_API_BASE_URL"
          npm run build

      - name: Verify Build
        run: |
          echo "===== BUILD FILES ====="
          ls -lah dist
          find dist -maxdepth 2 -type f

      - name: Deploy Frontend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "dist/*"
          target: "/var/www/resumeparser"
          strip_components: 1
          overwrite: true

      - name: Verify Server Files
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            set -e

            echo "===== SERVER DIRECTORY ====="
            ls -lah /var/www/resumeparser

            echo "===== INDEX FILE ====="
            ls -lah /var/www/resumeparser/index.html

            echo "===== INDEX MODIFIED TIME ====="
            stat /var/www/resumeparser/index.html

            echo "===== NGINX TEST ====="
            sudo nginx -t

            echo "===== RELOADING NGINX ====="
            sudo systemctl reload nginx

            echo "===== DEPLOYMENT COMPLETED ====="
