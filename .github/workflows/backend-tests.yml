name: Backend tests

# Runs the backend test suite on every pull request, including the Phase 12 company-isolation and
# permission suites (tests/test_isolation_suite.py, tests/test_permission_suite.py). Tests only: no deploy.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    defaults:
      run:
        working-directory: server-backend

    env:
      DATABASE_URL: mongodb://localhost:27017
      DATABASE_NAME: hirelogics_ci
      SECRET_KEY: ci-only-${{ github.run_id }}-not-a-real-key
      PERMISSIONS_MODE: warn

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: server-backend/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Isolation and permission suites
        run: python -m pytest -q tests/test_isolation_suite.py tests/test_permission_suite.py tests/test_security_hardening.py

      - name: All tests
        run: python -m pytest -q
