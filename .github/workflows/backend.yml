- name: Install Dependencies & Restart
  uses: appleboy/ssh-action@v1.0.3
  with:
    host: ${{ secrets.SERVER_HOST }}
    username: ${{ secrets.SERVER_USER }}
    key: ${{ secrets.SERVER_SSH_KEY }}
    port: 22
    script: |
      set -e

      echo "===== NODE ====="
      which node
      node -v

      echo "===== NPM ====="
      which npm
      npm -v

      echo "===== PM2 ====="

      export PATH="$PATH:/usr/local/bin:/usr/bin:/root/.npm-global/bin:/root/.nvm/versions/node/*/bin"

      if ! command -v pm2 >/dev/null 2>&1; then
        echo "PM2 not found in PATH"
        echo "Searching for PM2..."

        PM2_PATH=$(find /root /usr/local /usr -type f -name pm2 -perm -111 2>/dev/null | head -1 || true)

        if [ -n "$PM2_PATH" ]; then
          export PATH="$(dirname "$PM2_PATH"):$PATH"
        fi
      fi

      command -v pm2
      pm2 -v

      cd /root/ai_resume/Ai_resumeparser/server-backend

      echo "===== BACKEND DIRECTORY ====="
      pwd
      ls -lah

      echo "===== PYTHON ENVIRONMENT ====="

      if [ ! -d "venv" ]; then
        python3 -m venv venv
      fi

      source venv/bin/activate

      python --version
      pip --version

      pip install --upgrade pip
      pip install -r requirements.txt

      echo "===== RESTARTING PM2 ====="

      pm2 delete python-app || true

      pm2 start ./venv/bin/uvicorn \
        --interpreter none \
        --name python-app \
        -- app.main:app \
        --host 0.0.0.0 \
        --port 8012

      pm2 save

      echo "===== PM2 STATUS ====="
      pm2 status

      echo "===== API TEST ====="
      sleep 3
      curl -f http://127.0.0.1:8012 || true

      echo "===== DEPLOYMENT COMPLETED ====="
