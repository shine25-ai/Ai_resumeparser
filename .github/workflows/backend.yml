name: Deploy Resume Parser Backend

on:
  push:
    branches:
      - development

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # Checkout Source
      # ==========================================
      - name: Checkout Source
        uses: actions/checkout@v4


      # ==========================================
      # Upload Backend
      # ==========================================
      - name: Upload Backend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22

          source: "server-backend/*"

          target: "/root/ai_resume/Ai_resumeparser"

          strip_components: 1

          overwrite: true


      # ==========================================
      # Install Dependencies & Restart Backend
      # ==========================================
      - name: Install Dependencies & Restart
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22

          script: |

            set -e

            echo ""
            echo "=========================================="
            echo "STARTING BACKEND DEPLOYMENT"
            echo "=========================================="
            echo ""


            # ==========================================
            # Backend Directory
            # ==========================================

            APP_DIR="/root/ai_resume/Ai_resumeparser/server-backend"
            VENV="$APP_DIR/venv"
            ENV_FILE="$APP_DIR/.env"
            APP_NAME="python-app"
            PORT="8012"

            cd "$APP_DIR"


            echo "=========================================="
            echo "BACKEND DIRECTORY"
            echo "=========================================="

            pwd

            ls -lah


            # ==========================================
            # Check .env
            # ==========================================

            echo ""
            echo "=========================================="
            echo "CHECKING ENVIRONMENT"
            echo "=========================================="


            if [ ! -f "$ENV_FILE" ]; then

              echo "ERROR: .env file not found:"
              echo "$ENV_FILE"

              exit 1

            fi


            echo ".env file exists."


            if grep -q "^DATABASE_URL=" "$ENV_FILE"; then

              echo "DATABASE_URL found."

            else

              echo "ERROR: DATABASE_URL missing from .env"

              exit 1

            fi


            # ==========================================
            # Load NVM
            # ==========================================

            echo ""
            echo "=========================================="
            echo "LOADING NVM"
            echo "=========================================="


            export NVM_DIR="$HOME/.nvm"


            if [ -s "$NVM_DIR/nvm.sh" ]; then

              source "$NVM_DIR/nvm.sh"

              echo "NVM loaded."

            fi


            # ==========================================
            # Node 22
            # ==========================================

            if command -v nvm >/dev/null 2>&1; then

              nvm use 22 || true

            fi


            echo "Node:"
            node -v || true


            echo "NPM:"
            npm -v || true


            # ==========================================
            # PM2 PATH
            # ==========================================

            echo ""
            echo "=========================================="
            echo "CHECKING PM2"
            echo "=========================================="


            export PATH="$PATH:/usr/local/bin:/usr/bin"


            if [ -d "$HOME/.nvm/versions/node" ]; then

              while read NODE_BIN
              do

                export PATH="$NODE_BIN:$PATH"

              done < <(
                find "$HOME/.nvm/versions/node" \
                -type d \
                -path "*/bin" \
                2>/dev/null
              )

            fi


            echo "PM2 location:"

            command -v pm2 || true


            # ==========================================
            # Search PM2
            # ==========================================

            if ! command -v pm2 >/dev/null 2>&1; then

              echo "PM2 not found in PATH."

              echo "Searching for PM2..."

              PM2_PATH=$(find /root /usr/local /usr \
                -type f \
                -name pm2 \
                -perm -111 \
                2>/dev/null |
                head -1 || true)


              if [ -n "$PM2_PATH" ]; then

                echo "PM2 found at:"
                echo "$PM2_PATH"

                export PATH="$(dirname "$PM2_PATH"):$PATH"

              fi

            fi


            # ==========================================
            # Final PM2 Check
            # ==========================================

            if ! command -v pm2 >/dev/null 2>&1; then

              echo "ERROR: PM2 is not installed."

              exit 1

            fi


            echo "PM2 version:"
            pm2 -v


            # ==========================================
            # Python Virtual Environment
            # ==========================================

            echo ""
            echo "=========================================="
            echo "PYTHON ENVIRONMENT"
            echo "=========================================="


            if [ ! -d "$VENV" ]; then

              echo "Creating virtual environment..."

              python3 -m venv "$VENV"

            fi


            source "$VENV/bin/activate"


            echo "Python:"
            python --version


            echo "Python path:"
            which python


            echo "Pip:"
            pip --version


            # ==========================================
            # Requirements
            # ==========================================

            echo ""
            echo "=========================================="
            echo "INSTALLING PYTHON DEPENDENCIES"
            echo "=========================================="


            if [ ! -f "$APP_DIR/requirements.txt" ]; then

              echo "ERROR: requirements.txt not found."

              exit 1

            fi


            python -m pip install --upgrade pip

            python -m pip install -r requirements.txt


            echo "Python dependencies installed."


            # ==========================================
            # MongoDB Connection Test
            # ==========================================

            echo ""
            echo "=========================================="
            echo "TESTING MONGODB CONNECTION"
            echo "=========================================="


            python -c "
            from pymongo import MongoClient
            from dotenv import load_dotenv
            import os
            import sys

            load_dotenv('/root/ai_resume/Ai_resumeparser/server-backend/.env')

            database_url = os.getenv('DATABASE_URL')

            if not database_url:
                print('ERROR: DATABASE_URL is empty')
                sys.exit(1)

            try:

                client = MongoClient(
                    database_url,
                    serverSelectionTimeoutMS=10000
                )

                result = client.admin.command('ping')

                print('MongoDB ping result:', result)

                if result.get('ok') != 1:
                    print('ERROR: MongoDB ping failed')
                    sys.exit(1)

                print('MongoDB connection successful')

                client.close()

            except Exception as e:

                print('ERROR: MongoDB connection failed')
                print(str(e))

                sys.exit(1)
            "


            # ==========================================
            # FastAPI Import Test
            # ==========================================

            echo ""
            echo "=========================================="
            echo "TESTING FASTAPI APPLICATION"
            echo "=========================================="


            python -c "
            from dotenv import load_dotenv

            load_dotenv('/root/ai_resume/Ai_resumeparser/server-backend/.env')

            from app.main import app

            print('FastAPI application imported successfully')
            "


            # ==========================================
            # Stop Existing Application
            # ==========================================

            echo ""
            echo "=========================================="
            echo "STOPPING OLD APPLICATION"
            echo "=========================================="


            pm2 delete "$APP_NAME" || true


            # ==========================================
            # Start FastAPI
            # ==========================================

            echo ""
            echo "=========================================="
            echo "STARTING FASTAPI"
            echo "=========================================="


            pm2 start "$VENV/bin/uvicorn" \
              --interpreter none \
              --name "$APP_NAME" \
              --cwd "$APP_DIR" \
              -- \
              app.main:app \
              --host 0.0.0.0 \
              --port "$PORT"


            # ==========================================
            # Save PM2
            # ==========================================

            echo ""
            echo "=========================================="
            echo "SAVING PM2"
            echo "=========================================="


            pm2 save


            # ==========================================
            # Wait for Application
            # ==========================================

            echo ""
            echo "=========================================="
            echo "WAITING FOR BACKEND"
            echo "=========================================="


            sleep 10


            # ==========================================
            # PM2 Status
            # ==========================================

            echo ""
            echo "=========================================="
            echo "PM2 STATUS"
            echo "=========================================="


            pm2 status


            # ==========================================
            # Check PM2 Online
            # ==========================================

            echo ""
            echo "=========================================="
            echo "CHECKING PM2 APPLICATION"
            echo "=========================================="


            PM2_STATUS=$(pm2 jlist | python -c "
            import sys
            import json

            data = json.load(sys.stdin)

            for process in data:

                if process.get('name') == 'python-app':

                    print(
                        process
                        .get('pm2_env', {})
                        .get('status', 'unknown')
                    )

                    break

            else:

                print('not_found')
            ")


            echo "PM2 Status: $PM2_STATUS"


            if [ "$PM2_STATUS" != "online" ]; then

              echo ""
              echo "ERROR: python-app is not online."

              echo ""
              echo "=========================================="
              echo "PM2 LOGS"
              echo "=========================================="

              pm2 logs "$APP_NAME" \
                --lines 100 \
                --nostream || true

              exit 1

            fi


            echo "python-app is ONLINE."


            # ==========================================
            # Port Check
            # ==========================================

            echo ""
            echo "=========================================="
            echo "PORT $PORT CHECK"
            echo "=========================================="


            if curl -fsS \
              --max-time 10 \
              "http://127.0.0.1:$PORT/docs" \
              >/dev/null 2>&1; then

              echo "Backend is responding on /docs."

            else

              echo "Backend /docs check failed."


              # Try root endpoint
              if curl -fsS \
                --max-time 10 \
                "http://127.0.0.1:$PORT/" \
                >/dev/null 2>&1; then

                echo "Backend root endpoint is responding."

              else

                echo ""
                echo "ERROR: Backend did not respond."

                echo ""
                echo "=========================================="
                echo "PM2 STATUS"
                echo "=========================================="

                pm2 status


                echo ""
                echo "=========================================="
                echo "PM2 LOGS"
                echo "=========================================="

                pm2 logs "$APP_NAME" \
                  --lines 100 \
                  --nostream || true

                exit 1

              fi

            fi


            # ==========================================
            # Nginx Test
            # ==========================================

            echo ""
            echo "=========================================="
            echo "NGINX TEST"
            echo "=========================================="


            sudo nginx -t


            # ==========================================
            # Reload Nginx
            # ==========================================

            echo ""
            echo "=========================================="
            echo "RELOADING NGINX"
            echo "=========================================="


            sudo systemctl reload nginx


            # ==========================================
            # Final Status
            # ==========================================

            echo ""
            echo "=========================================="
            echo "FINAL STATUS"
            echo "=========================================="


            pm2 status


            echo ""
            echo "=========================================="
            echo "DEPLOYMENT COMPLETED SUCCESSFULLY"
            echo "=========================================="

            echo ""
            echo "Backend      : $APP_NAME"
            echo "Port         : $PORT"
            echo "MongoDB      : Connected"
            echo "FastAPI      : Running"
            echo "Nginx        : Reloaded"

            echo ""
            echo "Backend deployment successful."

            echo "=========================================="
