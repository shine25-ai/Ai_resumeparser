name: Deploy Resume Parser Backend

on:
  push:
    branches:
      - development

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # Checkout Source
      # ==========================================
      - name: Checkout Source
        uses: actions/checkout@v4

      # ==========================================
      # Upload Backend
      # ==========================================
      - name: Upload Backend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "server-backend/*"
          target: "/root/ai_resume/Ai_resumeparser"
          strip_components: 1
          overwrite: true

      # ==========================================
      # Install Dependencies & Restart Backend
      # ==========================================
      - name: Install Dependencies & Restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22

          script: |
            set -e

            echo "=========================================="
            echo "STARTING BACKEND DEPLOYMENT"
            echo "=========================================="

            # ------------------------------------------
            # Backend directory
            # ------------------------------------------
            cd /root/ai_resume/Ai_resumeparser/server-backend

            echo "=========================================="
            echo "BACKEND DIRECTORY"
            echo "=========================================="

            pwd
            ls -lah

            # ------------------------------------------
            # Load NVM
            # ------------------------------------------
            echo "=========================================="
            echo "LOADING NVM"
            echo "=========================================="

            export NVM_DIR="$HOME/.nvm"

            if [ -s "$NVM_DIR/nvm.sh" ]; then
              echo "Loading NVM..."
              source "$NVM_DIR/nvm.sh"
            fi

            # ------------------------------------------
            # Select Node version
            # ------------------------------------------
            if command -v nvm >/dev/null 2>&1; then
              nvm use 22 || true
            fi

            # ------------------------------------------
            # Node information
            # ------------------------------------------
            echo "Node:"
            node -v || true

            echo "NPM:"
            npm -v || true

            # ------------------------------------------
            # Fix PM2 PATH
            # ------------------------------------------
            export PATH="$PATH:/usr/local/bin:/usr/bin"

            if [ -d "$HOME/.nvm/versions/node" ]; then

              find "$HOME/.nvm/versions/node" \
                -type d \
                -path "*/bin" \
                2>/dev/null |
              while read NODE_BIN
              do
                export PATH="$NODE_BIN:$PATH"
              done

            fi

            # ------------------------------------------
            # PM2 location
            # ------------------------------------------
            echo "PM2 location:"
            command -v pm2 || true

            # ------------------------------------------
            # Check PM2
            # ------------------------------------------
            if ! command -v pm2 >/dev/null 2>&1; then

              echo "PM2 not found."

              echo "Searching for PM2..."

              PM2_PATH=$(find /root /usr/local /usr \
                -type f \
                -name pm2 \
                -perm -111 \
                2>/dev/null |
                head -1 || true)

              if [ -n "$PM2_PATH" ]; then

                echo "PM2 found at:"
                echo "$PM2_PATH"

                export PATH="$(dirname "$PM2_PATH"):$PATH"

              fi

            fi

            # ------------------------------------------
            # Final PM2 check
            # ------------------------------------------
            if ! command -v pm2 >/dev/null 2>&1; then

              echo "ERROR: PM2 is not installed or cannot be found."

              exit 1

            fi

            echo "PM2:"
            pm2 -v

            # ------------------------------------------
            # Python virtual environment
            # ------------------------------------------
            echo "=========================================="
            echo "PYTHON ENVIRONMENT"
            echo "=========================================="

            if [ ! -d "venv" ]; then

              echo "Creating virtual environment..."

              python3 -m venv venv

            fi

            # Activate venv
            source venv/bin/activate

            echo "Python:"
            python --version

            echo "Python Path:"
            which python

            echo "Pip:"
            pip --version

            # ------------------------------------------
            # Install dependencies
            # ------------------------------------------
            echo "=========================================="
            echo "INSTALLING PYTHON DEPENDENCIES"
            echo "=========================================="

            python -m pip install --upgrade pip

            python -m pip install -r requirements.txt

            # ------------------------------------------
            # Check .env
            # ------------------------------------------
            echo "=========================================="
            echo "CHECKING ENVIRONMENT"
            echo "=========================================="

            if [ ! -f ".env" ]; then

              echo "ERROR: .env file not found."

              exit 1

            fi

            echo ".env file exists."

            # ------------------------------------------
            # Check DATABASE_URL
            # ------------------------------------------
            if grep -q "^DATABASE_URL=" .env; then

              echo "DATABASE_URL found."

            else

              echo "ERROR: DATABASE_URL is missing from .env."

              exit 1

            fi

            # ------------------------------------------
            # Test MongoDB Connection
            # ------------------------------------------
            echo "=========================================="
            echo "TESTING MONGODB CONNECTION"
            echo "=========================================="

            python - <<'PY'
            from pymongo import MongoClient
            from dotenv import load_dotenv
            import os
            import sys

            load_dotenv()

            database_url = os.getenv("DATABASE_URL")

            if not database_url:
                print("ERROR: DATABASE_URL is empty.")
                sys.exit(1)

            try:

                client = MongoClient(
                    database_url,
                    serverSelectionTimeoutMS=10000
                )

                result = client.admin.command("ping")

                if result.get("ok") == 1:
                    print("MongoDB connection successful.")
                else:
                    print("MongoDB ping failed.")
                    print(result)
                    sys.exit(1)

                client.close()

            except Exception as e:

                print("MongoDB connection failed.")
                print(str(e))

                sys.exit(1)

            PY

            # ------------------------------------------
            # FastAPI import test
            # ------------------------------------------
            echo "=========================================="
            echo "TESTING FASTAPI APPLICATION"
            echo "=========================================="

            python - <<'PY'
            try:

                from app.main import app

                print("FastAPI application imported successfully.")

            except Exception as e:

                print("FastAPI application import failed.")
                print(str(e))

                raise

            PY

            # ------------------------------------------
            # Stop existing PM2 application
            # ------------------------------------------
            echo "=========================================="
            echo "STOPPING OLD APPLICATION"
            echo "=========================================="

            pm2 delete python-app || true

            # ------------------------------------------
            # Start FastAPI
            # ------------------------------------------
            echo "=========================================="
            echo "STARTING FASTAPI"
            echo "=========================================="

            pm2 start ./venv/bin/uvicorn \
              --interpreter none \
              --name python-app \
              -- \
              app.main:app \
              --host 0.0.0.0 \
              --port 8012

            # ------------------------------------------
            # Save PM2
            # ------------------------------------------
            echo "=========================================="
            echo "SAVING PM2"
            echo "=========================================="

            pm2 save

            # ------------------------------------------
            # PM2 Status
            # ------------------------------------------
            echo "=========================================="
            echo "PM2 STATUS"
            echo "=========================================="

            pm2 status

            # ------------------------------------------
            # Wait for application
            # ------------------------------------------
            echo "=========================================="
            echo "WAITING FOR BACKEND"
            echo "=========================================="

            sleep 8

            # ------------------------------------------
            # Check PM2 application
            # ------------------------------------------
            echo "=========================================="
            echo "CHECKING PYTHON APP"
            echo "=========================================="

            if pm2 describe python-app >/dev/null 2>&1; then

              echo "python-app exists in PM2."

            else

              echo "ERROR: python-app was not started."

              pm2 logs python-app --lines 100 --nostream || true

              exit 1

            fi

            # ------------------------------------------
            # Check port 8012
            # ------------------------------------------
            echo "=========================================="
            echo "PORT 8012 CHECK"
            echo "=========================================="

            if curl -f \
              --max-time 10 \
              http://127.0.0.1:8012 \
              >/dev/null 2>&1; then

              echo "Backend is running on port 8012."

            else

              echo "WARNING: Backend did not respond on port 8012."

              echo ""
              echo "=========================================="
              echo "PM2 STATUS"
              echo "=========================================="

              pm2 status

              echo ""
              echo "=========================================="
              echo "PM2 LOGS"
              echo "=========================================="

              pm2 logs python-app \
                --lines 100 \
                --nostream || true

              exit 1

            fi

            # ------------------------------------------
            # Nginx test
            # ------------------------------------------
            echo "=========================================="
            echo "NGINX TEST"
            echo "=========================================="

            sudo nginx -t

            # ------------------------------------------
            # Reload Nginx
            # ------------------------------------------
            echo "=========================================="
            echo "RELOADING NGINX"
            echo "=========================================="

            sudo systemctl reload nginx

            # ------------------------------------------
            # Final verification
            # ------------------------------------------
            echo "=========================================="
            echo "FINAL STATUS"
            echo "=========================================="

            pm2 status

            echo ""
            echo "=========================================="
            echo "DEPLOYMENT COMPLETED SUCCESSFULLY"
            echo "=========================================="

            echo "Backend deployment successful."
            echo "MongoDB connection successful."
            echo "FastAPI running on port 8012."
            echo "Nginx reloaded."

            echo "=========================================="
